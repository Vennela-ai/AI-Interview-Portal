<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview</title>

    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/interview.css') }}">
</head>

<body class="interview-page">

<div class="interview-container">

    <!-- Header -->
    <div class="interview-header">

        <div>
            <h1>🤖 AI Interview Portal</h1>
            <p>Answer every question carefully before submitting.</p>
        </div>

        <div class="timer-box">
            <span>Remaining Time</span>
            <h2 id="timer">20:00</h2>
        </div>

    </div>

    <!-- Progress -->
    <div class="progress-section">

        <div class="progress-info">
            <span id="questionCounter">
                Question 1 / {{ questions|length }}
            </span>

            <span id="progressText">
                0%
            </span>
        </div>

        <div class="progress-bar">

            <div class="progress-fill"></div>

        </div>

    </div>

   <form id="interviewForm"
      action="{{ url_for('submit_answers') }}"
      method="POST">
        {% for question in questions %}

        <div class="question-card {% if loop.index != 1 %}hidden{% endif %}">

            <h3>
                Question {{ loop.index }}
            </h3>

            <p class="question-text">

                {{ question }}

            </p>

            <input
                type="hidden"
                name="question{{ loop.index }}"
                value="{{ question }}">

            <textarea
                name="answer{{ loop.index }}"
                placeholder="Type your answer here..."
                required></textarea>

            <div class="bottom-row">

                <small class="char-count">
                    0 characters
                </small>

            </div>

        </div>

        {% endfor %}

        <!-- Navigation -->

        <div class="navigation-buttons">

            <button
                type="button"
                id="prevBtn"
                class="nav-btn"
                disabled>

                ⬅ Previous

            </button>

            <button
                type="button"
                id="nextBtn"
                class="nav-btn">

                Next ➜

            </button>

            <button
                type="submit"
                id="submitBtn"
                class="submit-btn"
                style="display:none;">

                🚀 Submit Interview

            </button>

        </div>

    </form>

</div>

<script src="{{ url_for('static', filename='js/interview.js') }}"></script>

</body>
</html>
