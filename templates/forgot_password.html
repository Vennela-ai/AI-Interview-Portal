<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">

<div class="auth-box">

<h2>Forgot Password</h2>

<form method="POST">

    <input
        type="email"
        name="email"
        class="form-control"
        placeholder="Enter your email"
        required>

    <button class="auth-btn">
        Send OTP
    </button>

</form>

</div>

</body>
</html>
